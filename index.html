<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ da Operação • Pedir música</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="brand"><div class="logo">🎧</div><div><h1>DJ da Operação</h1><div class="muted">Sua música, nossa energia!</div></div></div><section class="panel hero"><h2>🎶 Peça a próxima música</h2><label>Seu nome<input id="name" maxlength="40" placeholder="Como você quer aparecer na fila?"></label><label>Link do YouTube<input id="url" placeholder="Cole um link de vídeo do YouTube"></label><button id="add">Adicionar à fila 🎵</button><p id="message" class="status"></p><div id="search-area" hidden><h2>Ou pesquise uma música</h2><div class="flex"><input id="query" placeholder="Nome da música ou artista"><button id="search">Pesquisar</button></div><div id="results"></div></div></section><section class="panel"><h2>🔊 Tocando agora</h2><div id="now"></div></section><section class="panel"><h2>📋 Próximas músicas</h2><div id="queue"></div></section><p class="muted tiny">Os pedidos entram na fila, mas a reprodução depende do player oficial do YouTube e das permissões do navegador.</p></main><script src="/app.js"></script><script>let n=document.querySelector('#name');n.value=localStorage.getItem('dj_name')||'';document.querySelector('#add').onclick=async()=>{try{let id=vid(document.querySelector('#url').value);if(!id)throw Error('Cole um link válido do YouTube.');await api('add',{name:n.value,video:id});localStorage.setItem('dj_name',n.value);document.querySelector('#url').value='';message('Música adicionada à fila!');update()}catch(e){message(e.message,true)}};api('config').then(c=>{if(c.search_enabled)document.querySelector('#search-area').hidden=false});document.querySelector('#search').onclick=async()=>{let el=document.querySelector('#results');el.textContent='Pesquisando...';try{let d=await api('search?q='+encodeURIComponent(document.querySelector('#query').value));el.innerHTML=d.results.map(s=>`<div class="song"><img src="${thumb(s.id)}"><div class="info"><strong>${escapeHtml(s.title)}</strong><small>${escapeHtml(s.channel)}</small></div><button data-id="${s.id}">Pedir</button></div>`).join('')||'Nenhum resultado';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{let s=d.results.find(x=>x.id===b.dataset.id);await api('add',{name:n.value,video:s.id,title:s.title});localStorage.setItem('dj_name',n.value);message('Música adicionada!');update()}catch(e){message(e.message,true)}})}catch(e){el.textContent=e.message}}</script></body></html>
